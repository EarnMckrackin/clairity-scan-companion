<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Verax verification cover</title>
  <desc id="desc">A protocol dashboard auditing a digital sculpture beside the Verax compass mark.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="120" x2="1800" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111b25"/>
      <stop offset="0.36" stop-color="#dbe5e8"/>
      <stop offset="0.66" stop-color="#f7fbfc"/>
      <stop offset="1" stop-color="#b3c1c7"/>
    </linearGradient>
    <linearGradient id="panel" x1="178" y1="168" x2="1010" y2="752" gradientUnits="userSpaceOnUse">
