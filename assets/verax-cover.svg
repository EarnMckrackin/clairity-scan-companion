      <stop offset="0.5" stop-color="#7ee8ff"/>
      <stop offset="1" stop-color="#43caff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
